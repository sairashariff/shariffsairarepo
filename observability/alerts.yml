groups:
  - name: orders-rate-limits
    rules:
      - alert: OrdersTenantHigh429Rate
        expr: |
          (
            sum by (tenant) (rate(orders_rate_limit_decisions_total{mode="enforce",outcome="rejected"}[5m]))
            /
            sum by (tenant) (rate(orders_rate_limit_decisions_total{mode="enforce"}[5m]))
          ) > 0.10
          and
          sum by (tenant) (rate(orders_rate_limit_decisions_total{mode="enforce",outcome="rejected"}[5m])) > (5 / 60)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Orders API tenant {{ $labels.tenant }} has sustained HTTP 429s"
          description: "Check the tenant plan/override and batch job before raising limits."
      - alert: OrdersRateLimiterUnavailable
        expr: sum(rate(orders_rate_limit_decisions_total{outcome="error"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Orders API Redis rate limiting is failing"
          description: "Enforce fails closed with 503; log-only logs and bypasses the limiter."
      - alert: OrdersRateLimiterSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(orders_rate_limit_duration_seconds_bucket[5m]))) >= 0.005
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Orders rate limiter p95 is at least 5 ms"
          description: "Check regional Redis latency, event-loop pressure, and capacity."
